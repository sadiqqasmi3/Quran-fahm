name: quran-feham

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quran_feham}
      POSTGRES_USER: ${POSTGRES_USER:-quran_feham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quran-feham-local-only}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data

  redis:
    # 8.10.2 is the target patch. The official image currently publishes
    # 8.10.1; do not replace this with an unreviewed third-party image.
    image: redis:8.10.1-alpine
    profiles: ["optional"]
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-quran-feham-redis-local-only}",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-quran-feham-redis-local-only}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - data

  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: ["mail"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - app

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: quran-feham-api:local
    profiles: ["api", "web", "app"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quran_feham}:${POSTGRES_PASSWORD:-quran-feham-local-only}@postgres:5432/${POSTGRES_DB:-quran_feham}
    command: ["pnpm", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  api:
    image: quran-feham-api:local
    profiles: ["api", "web", "app"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-quran_feham}:${POSTGRES_PASSWORD:-quran-feham-local-only}@postgres:5432/${POSTGRES_DB:-quran_feham}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-jwt-secret}
      JWT_ISSUER: ${JWT_ISSUER:-quran-feham-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-quran-feham-web}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-development-only-change-this-refresh-pepper}
      OTP_PEPPER: ${OTP_PEPPER:-development-only-change-this-otp-pepper}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      REQUIRE_ORIGIN: ${REQUIRE_ORIGIN:-false}
      EXPOSE_DEVELOPMENT_CODES: ${EXPOSE_DEVELOPMENT_CODES:-true}
      GENERIC_AUTH_RESPONSE_MS: ${GENERIC_AUTH_RESPONSE_MS:-750}
      TRUST_PROXY: ${TRUST_PROXY:-linklocal,uniquelocal}
      SMTP_HOST: ${CONTAINER_SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Quran Feham <no-reply@localhost>}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
        required: false
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.http.routers.quran-feham-api.rule: PathPrefix(`/api/v1`) || Path(`/health`) || Path(`/ready`)
      traefik.http.routers.quran-feham-api.entrypoints: web
      traefik.http.routers.quran-feham-api.priority: "100"
      traefik.http.services.quran-feham-api.loadbalancer.server.port: "4000"
    networks:
      - app
      - data

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    profiles: ["web", "app"]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      QURAN_FEHAM_API_ORIGIN: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.quran-feham-web.rule: PathPrefix(`/`)
      traefik.http.routers.quran-feham-web.entrypoints: web
      traefik.http.routers.quran-feham-web.priority: "1"
      traefik.http.services.quran-feham-web.loadbalancer.server.port: "3000"
    networks:
      - app

  traefik:
    image: traefik:v3.7.13
    profiles: ["api", "web", "app"]
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
    ports:
      - "${TRAEFIK_BIND:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - app

volumes:
  postgres-data:
  redis-data:
  mailpit-data:

networks:
  app:
  data:
    internal: true
